<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Contact Us - Derma.AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2c3e50;
        }

        .container {
            width: 1000px;
            background-color: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
            font-weight: 600;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 4px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            border-radius: 2px;
        }

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 40px;
            margin-top: 30px;
        }

        .contact-info {
            background: #f8fafc;
            padding: 30px;
            border-radius: 16px;
        }

        .contact-method {
            margin-bottom: 25px;
        }

        .contact-method h3 {
            font-size: 1.2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-method i {
            color: #3498db;
        }

        .contact-method p {
            color: #64748b;
            margin: 0;
            line-height: 1.6;
        }

        .social-links {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .social-links a {
            color: #3498db;
            font-size: 1.5em;
            transition: transform 0.3s ease;
        }

        .social-links a:hover {
            transform: translateY(-3px);
        }

        form#contact-form {
            background-color: #fff;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        form#contact-form input,
        form#contact-form select,
        form#contact-form textarea {
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        form#contact-form input:focus,
        form#contact-form select:focus,
        form#contact-form textarea:focus {
            border-color: #3498db;
            outline: none;
        }

        form#contact-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        form#contact-form button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
            align-self: flex-start;
        }

        form#contact-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(52, 152, 219, 0.3);
        }

        #form-status {
            margin-top: 10px;
            padding: 10px;
            font-size: 1rem;
            color: #27ae60;
            background-color: #d4edda;
            border: 1.5px solid #27ae60;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .button-container {
            text-align: center;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 2px solid #e2e8f0;
        }

        .back-button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.2);
            text-decoration: none;
            display: inline-block;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(52, 152, 219, 0.3);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                width: 95%;
            }

            .contact-grid {
                grid-template-columns: 1fr;
            }

            form#contact-form button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Contact Us</h1>

    <div class="contact-grid">
        <div class="contact-info">
            <div class="contact-method">
                <h3><i class="fas fa-map-marker-alt"></i> Location</h3>
                <p>Sukhsagar Nagar<br>Katraj 411046<br>India</p>
            </div>
            <div class="contact-method">
                <h3><i class="fas fa-envelope"></i> Email</h3>
                <p>contact@derma.ai<br>support@derma.ai</p>
            </div>
            <div class="contact-method">
                <h3><i class="fas fa-phone"></i> Phone</h3>
                <p>+91-5559960321<br>Monday - Friday <br>9:00 - 18:00 GMT+5:30</p>
            </div>
            <div class="contact-method">
                <h3><i class="fas fa-comments"></i> Social Media</h3>
                <div class="social-links">
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-facebook"></i></a>
                </div>
            </div>
        </div>

        <form id="contact-form">
            <input type="text" name="name" placeholder="Name" required />
            <input type="email" name="email" placeholder="Email Address" required />
            <textarea name="message" placeholder="Type your message here..." required></textarea>
            <button type="submit">Send Message</button>
            <div id="form-status">Thank you! Your message has been sent successfully.</div>
        </form>
    </div>

    <div class="button-container">
        <a href="/" class="back-button">Back to Home</a>
    </div>
</div>

<script>
    (function () {
        emailjs.init("fXLufBXZT9Bh72W-t"); // Your actual public key here
    })();

    document.getElementById('contact-form').addEventListener('submit', function (e) {
        e.preventDefault();

        emailjs.sendForm('service_prkjs0m', 'template_n8v5eld', this)
            .then(function () {
                document.getElementById('form-status').style.display = 'block';
            }, function (error) {
                alert('Oops! Failed to send message: ' + error.text);
            });

        this.reset();
    });
</script>

</body>
</html>
